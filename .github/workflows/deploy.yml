name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Enables pushing to ghcr.io

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  APRSC_VERSION: "2.1.21"
  BUILD_REV: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Add QEMU for multi-architecture emulation (ARM64, ARMv7, etc.)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Set up Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate Docker Tags
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.APRSC_VERSION }}-r${{ env.BUILD_REV }}
            type=raw,value=${{ env.APRSC_VERSION }}
            type=raw,value=2.1
            type=raw,value=latest

      # 5. Build and Push Multi-Arch Image
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APRSC_VERSION=${{ env.APRSC_VERSION }}