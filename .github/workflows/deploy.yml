name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # Enables pushing to ghcr.io

env:
  # Set your repository name here (e.g., ghcr.io/owner/aprsc)
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  APRSC_VERSION: "2.1.21"
  BUILD_REV: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.APRSC_VERSION }}-r${{ env.BUILD_REV }}
            type=raw,value=${{ env.APRSC_VERSION }}
            type=raw,value=2.1
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APRSC_VERSION=${{ env.APRSC_VERSION }}